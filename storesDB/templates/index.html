<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stores DB</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
  <header>
    <h1>Stores DB</h1>
    <span class="count" id="count"></span>
    <button type="button" class="theme-toggle" id="theme-toggle" title="Tema claro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    </button>
  </header>

  <div class="container">
    <div class="card">
      <div class="filters">
        <div class="filter-row">
          <input type="search" id="search" placeholder="Buscar (nombre, código, URL, IATA, país...)">
        </div>
        <div class="filter-row">
          <span class="lbl">División</span>
          <div class="pill-group" id="pills-division"></div>
        </div>
        <div class="filter-row">
          <span class="lbl">Región</span>
          <div class="pill-group" id="pills-region"></div>
        </div>
        <div class="filter-row">
          <span class="lbl">Idioma</span>
          <div class="pill-group" id="pills-language"></div>
        </div>
        <div class="filter-row">
          <span class="lbl">País</span>
          <div class="ms" id="ms-country">
            <button type="button" class="ms-toggle" id="ms-country-toggle">País: todos</button>
            <div class="ms-panel">
              <input type="text" class="ms-search" id="ms-country-search" placeholder="Buscar país...">
              <div class="ms-options" id="ms-country-options"></div>
            </div>
          </div>
          <span class="lbl">Estado</span>
          <div class="seg" id="seg-status">
            <button type="button" data-val="all" class="active">Todos</button>
            <button type="button" data-val="1">Active</button>
            <button type="button" data-val="0">No activo</button>
          </div>
        </div>
        <div class="actions-row">
          <button class="ghost" id="clear">Limpiar filtros</button>
          <span class="spacer"></span>
          <button class="primary" id="new">+ Nuevo registro</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Div</th>
              <th>store_id</th>
              <th>code</th>
              <th>name</th>
              <th>website_id</th>
              <th>store_url</th>
              <th>website_name</th>
              <th>code_web</th>
              <th>website_url</th>
              <th>Estado</th>
              <th>IATA</th>
              <th>Idioma</th>
              <th>País</th>
              <th>Región</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h2 id="modal-title">Editar registro</h2>
      <div class="grid" id="form"></div>
      <div class="modal-actions">
        <button id="cancel">Cancelar</button>
        <button class="primary" id="save">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toast">Copiado</div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
